{% extends 'base.html' %}

{% block title %}Manpower Recommendations - Admin Dashboard{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>
    .rec-card { border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px 18px; background: #fff; transition: box-shadow 120ms ease; }
    .rec-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
    .rec-card + .rec-card { margin-top: 14px; }
    .move-row { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 1px solid #f1f5f9; border-radius: 10px; margin-top: 8px; background: #fafafa; }
    .move-row .arrow { font-size: 1.3rem; color: #2563eb; }
    .badge-impact { background: rgba(37,99,235,0.12); color: #1d4ed8; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 0.75rem; }
    .badge-dept { background: rgba(99,102,241,0.10); color: #4338ca; padding: 2px 8px; border-radius: 999px; font-size: 0.65rem; font-weight: 600; }
    .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
</style>

<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div>
        <h2 class="fw-bold mb-1">Manpower Recommendations</h2>
        <div class="small text-secondary" id="recSubtitle">Loading…</div>
    </div>
    <div class="d-flex gap-2 align-items-end flex-wrap">
        <div>
            <label class="form-label small fw-bold text-uppercase mb-0" style="font-size:0.6rem;">Site</label>
            <select id="siteFilter" class="form-select form-select-sm" onchange="loadData()">
                <option value="all">All Sites</option>
            </select>
        </div>
        <div>
            <label class="form-label small fw-bold text-uppercase mb-0" style="font-size:0.6rem;">Sensitivity</label>
            <select id="sensitivity" class="form-select form-select-sm" onchange="loadData()">
                <option value="strict">Strict (only big gaps)</option>
                <option value="default" selected>Default</option>
                <option value="aggressive">Aggressive (suggest more)</option>
            </select>
        </div>
    </div>
</div>

<div id="recList">
    <div class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm"></div> Loading…</div>
</div>

{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadSites();
        loadData();
    });

    async function loadSites() {
        try {
            const res = await fetch('/api/attendance/stats/');
            const data = await res.json();
            const sel = document.getElementById('siteFilter');
            (data.sites || []).forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id; opt.textContent = s.name;
                sel.appendChild(opt);
            });
        } catch (e) {}
    }

    const PRESETS = {
        strict:     { over: 2.0, under: 0.3 },
        default:    { over: 1.5, under: 0.5 },
        aggressive: { over: 1.25, under: 0.6 },
    };

    async function loadData() {
        const site = document.getElementById('siteFilter').value;
        const sens = document.getElementById('sensitivity').value;
        const p = PRESETS[sens] || PRESETS.default;
        const c = document.getElementById('recList');
        c.innerHTML = `<div class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm"></div> Crunching numbers…</div>`;
        try {
            const url = `/api/attendance/analytics/manpower-recommendations/?site=${site}&over_factor=${p.over}&under_factor=${p.under}`;
            const res = await fetch(url);
            const data = await res.json();
            document.getElementById('recSubtitle').textContent =
                `${data.count} suggested redeployments (as of ${data.as_of}) — sensitivity: over > median × ${data.over_factor}, under < median × ${data.under_factor}`;
            render(data.recommendations || []);
        } catch (e) {
            c.innerHTML = `<div class="text-danger small text-center py-5">Failed to load recommendations.</div>`;
        }
    }

    function _esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function render(recs) {
        const c = document.getElementById('recList');
        if (!recs.length) {
            c.innerHTML = `<div class="empty-state">
                <div style="font-size:3rem;opacity:0.3;">⚖️</div>
                <h5 class="fw-bold text-secondary mt-3">Manpower is well-balanced</h5>
                <p class="text-muted">No trade has both surplus and shortage sites at the current sensitivity.</p>
            </div>`;
            return;
        }
        let html = '';
        for (const r of recs) {
            html += `<div class="rec-card">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
                    <div>
                        <span class="badge-dept">${_esc(r.department)}</span>
                        <div class="fw-bold mt-1">${_esc(r.position)}</div>
                        <div class="small text-secondary">Total ${r.total} across sites · median ${r.median}/site</div>
                    </div>
                    <span class="badge-impact">+${r.impact} moves</span>
                </div>
                ${r.moves.map(m => `
                    <div class="move-row">
                        <div class="flex-grow-1">
                            <div class="small text-secondary">From</div>
                            <div class="fw-bold">${_esc(m.from_site)}</div>
                            <div class="small text-secondary">currently ${m.from_count}</div>
                        </div>
                        <div class="arrow"><i class="ri-arrow-right-line"></i></div>
                        <div style="min-width: 60px; text-align: center;">
                            <div class="fw-bold" style="font-size:1.3rem; color:#1d4ed8;">${m.quantity}</div>
                            <div class="small text-secondary">worker${m.quantity > 1 ? 's' : ''}</div>
                        </div>
                        <div class="arrow"><i class="ri-arrow-right-line"></i></div>
                        <div class="flex-grow-1">
                            <div class="small text-secondary">To</div>
                            <div class="fw-bold">${_esc(m.to_site)}</div>
                            <div class="small text-secondary">currently ${m.to_count}</div>
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }
        c.innerHTML = html;
    }
</script>
{% endblock %}
