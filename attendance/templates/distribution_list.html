{% extends 'base.html' %}

{% block title %}Distribution List - Admin Dashboard{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>
    .dist-table { font-size: 0.78rem; }
    .dist-table th { position: sticky; top: 0; background: #2563eb; color: #fff; z-index: 2; white-space: nowrap; }
    .dist-table th, .dist-table td { border: 1px solid #e5e7eb; padding: 4px 8px; }
    .dist-table tr.dept-row td { background: #f3f4f6; font-weight: 700; }
    .dist-table tr.subtotal-row td { background: #fef3c7; font-weight: 700; }
    .dist-table td.num { text-align: center; font-variant-numeric: tabular-nums; }
    .dist-table .trade-name { white-space: normal; min-width: 220px; }
    .dist-scroll { overflow: auto; max-height: 70vh; }
    .nav-tabs-dist .nav-link { font-weight: 600; color: #475569; }
    .nav-tabs-dist .nav-link.active { background: #2563eb; color: #fff; }
</style>

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
        <h2 class="fw-bold mb-1">Distribution List</h2>
        <div class="small text-secondary">
            🇦🇪 <span id="live-clock"></span>
        </div>
    </div>
    <a href="{% url 'admin-dashboard' %}" class="btn btn-light border">
        <i class="ri-arrow-left-line"></i> Back to Dashboard
    </a>
</div>

<!-- Tabs -->
<ul class="nav nav-tabs nav-tabs-dist mb-3" id="distTabs" role="tablist">
    <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-tab="resource" type="button">
            <i class="ri-stack-line me-1"></i> Manpower Resources
        </button>
    </li>
    <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-tab="staff" type="button">
            <i class="ri-user-star-line me-1"></i> Staff Manpower
        </button>
    </li>
    <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-tab="worker" type="button">
            <i class="ri-team-line me-1"></i> Worker Manpower
        </button>
    </li>
</ul>

<!-- Filter bar -->
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body d-flex flex-wrap gap-2 align-items-end">
        <div>
            <label class="form-label small fw-bold text-secondary text-uppercase mb-1">Site</label>
            <select id="siteFilter" class="form-select form-select-sm" onchange="loadDistribution()">
                <option value="all">All Sites</option>
            </select>
        </div>
        <div class="flex-grow-1"></div>
        <button onclick="downloadExcel()" class="btn btn-success btn-sm">
            <i class="ri-file-excel-2-line"></i> Download Excel
        </button>
    </div>
</div>

<!-- Table -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div id="distContainer" class="dist-scroll">
            <div class="text-center text-muted py-5">Select a tab to load data…</div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    let currentType = 'resource';

    document.addEventListener('DOMContentLoaded', () => {
        // Tab clicks
        document.querySelectorAll('#distTabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#distTabs button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.getAttribute('data-tab');
                loadDistribution();
            });
        });
        startClock();
        loadDistribution();
    });

    function startClock() {
        const update = () => {
            const now = new Date();
            const el = document.getElementById('live-clock');
            if (el) el.textContent = now.toLocaleString('en-GB', { timeZone: 'Asia/Dubai', weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        };
        setInterval(update, 1000); update();
    }

    function _fmt(n) { return n === 0 || n == null ? '—' : Number(n).toLocaleString(); }

    async function loadDistribution() {
        const container = document.getElementById('distContainer');
        container.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary spinner-border-sm"></div><div class="small mt-2 text-secondary">Loading…</div></div>`;
        const site = document.getElementById('siteFilter').value;
        try {
            const res = await fetch(`/api/attendance/distribution/?type=${currentType}&site=${site}`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Failed');

            // Populate the site filter once
            const sel = document.getElementById('siteFilter');
            if (sel.options.length <= 1) {
                data.sites.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id; opt.textContent = s.name;
                    sel.appendChild(opt);
                });
            }

            renderTable(data);
        } catch (e) {
            container.innerHTML = `<div class="text-center py-5 text-danger small">Failed to load distribution data.</div>`;
        }
    }

    function renderTable(data) {
        const sites = data.sites || [];
        let html = `<table class="dist-table table table-bordered mb-0">`;
        // Header
        html += `<thead><tr>
            <th>Sr.</th>
            <th class="trade-name">Trade</th>
            ${sites.map(s => `<th>${s.name}</th>`).join('')}
            <th>Leave</th>
            <th>Total</th>
        </tr></thead><tbody>`;

        let sr = 1;
        for (const row of (data.rows || [])) {
            if (row.kind === 'dept') {
                html += `<tr class="dept-row"><td colspan="${sites.length + 4}">${row.name}</td></tr>`;
            } else if (row.kind === 'trade') {
                html += `<tr>
                    <td class="num">${sr++}</td>
                    <td class="trade-name">${row.name}</td>
                    ${sites.map(s => `<td class="num">${_fmt(row.counts[s.id])}</td>`).join('')}
                    <td class="num">${_fmt(row.leave)}</td>
                    <td class="num fw-bold">${_fmt(row.total)}</td>
                </tr>`;
            } else if (row.kind === 'subtotal') {
                html += `<tr class="subtotal-row">
                    <td></td>
                    <td>TOTAL</td>
                    ${sites.map(s => `<td class="num">${_fmt(row.counts[s.id])}</td>`).join('')}
                    <td class="num">${_fmt(row.leave)}</td>
                    <td class="num">${_fmt(row.total)}</td>
                </tr>`;
            }
        }

        html += `</tbody><tfoot><tr class="subtotal-row">
            <td colspan="${sites.length + 3}" class="text-end">Grand Total</td>
            <td class="num fw-bold">${_fmt(data.grand_total)}</td>
        </tr></tfoot></table>`;
        document.getElementById('distContainer').innerHTML = html;
    }

    function downloadExcel() {
        const site = document.getElementById('siteFilter').value;
        window.location.href = `/api/attendance/distribution/export/?type=${currentType}&site=${site}`;
    }
</script>
{% endblock %}
