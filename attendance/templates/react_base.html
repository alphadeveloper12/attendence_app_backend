{% load django_vite %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="google-maps-key" content="{{ google_maps_key|default:'' }}">
  <title>{% block title %}RocketAttendance — Workforce attendance built for the worksite{% endblock %}</title>
  <meta name="description" content="Tamper-proof face attendance, geofencing, visa-expiry alerts and AI manpower insights for GCC construction, contracting and labour operations. Works offline. Live in 3 weeks.">
  <meta name="theme-color" content="#f4f5f7">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* Match the app's light backdrop to avoid a flash on load. */
    html, body { margin: 0; background: #f4f5f7; }
    #root { min-height: 100vh; }
  </style>

  {% vite_react_refresh %}
  {% vite_hmr_client %}
  {% vite_asset 'src/main.tsx' %}
</head>
<body>
  <div id="root"></div>
</body>
</html>
