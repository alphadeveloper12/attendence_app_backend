{% extends 'base.html' %}
{% block title %}Login - Admin Dashboard{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4 p-md-5" style="max-width: 450px; width: 100%;">
        <h2 class="text-center mb-4" style="color: #667eea; font-weight: 700;">Admin Login</h2>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label fw-bold text-secondary">Username</label>
                <input type="text" id="username" name="username" class="form-control form-control-lg" required
                    autofocus>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-bold text-secondary">Password</label>
                <input type="password" id="password" name="password" class="form-control form-control-lg" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase">Login</button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <a href="{% url 'download-build' 'attendance' %}"
                class="btn btn-outline-primary w-100 text-decoration-none">
                📱 Download Application
            </a>
        </div>
    </div>
</div>
{% endblock %}
