{% extends 'base.html' %}

{% block title %}Departments - Admin Dashboard{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>
    .dept-row { border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; transition: box-shadow 120ms ease; }
    .dept-row:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    .dept-row .dept-head { padding: 14px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .dept-row .dept-head .dept-toggle { color: #94a3b8; transition: transform 120ms ease; }
    .dept-row.is-open .dept-head .dept-toggle { transform: rotate(90deg); color: #2563eb; }
    .dept-row .dept-body { display: none; padding: 0 18px 18px; border-top: 1px solid #f1f5f9; }
    .dept-row.is-open .dept-body { display: block; }
    .pos-row { padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
    .pos-row:hover { background: #f8fafc; }
    .pos-row + .pos-row { margin-top: 2px; }
    .badge-soft { background: rgba(59, 130, 246, 0.1); color: #1d4ed8; font-weight: 600; border-radius: 999px; padding: 2px 10px; font-size: 0.7rem; }
    .badge-soft.staff { background: rgba(99,102,241,0.10); color: #4338ca; }
    .badge-soft.worker { background: rgba(34,197,94,0.10); color: #15803d; }
    .badge-soft.resource { background: rgba(217,119,6,0.10); color: #b45309; }
    .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
</style>

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
        <h2 class="fw-bold mb-1">Departments</h2>
        <div class="small text-secondary">
            Manage departments + positions used across the dashboard, distribution list, and modals.
        </div>
    </div>
    <div class="d-flex gap-2">
        <input type="text" id="deptSearch" class="form-control form-control-sm" placeholder="Search…" style="max-width:240px;" oninput="filterList()">
        <button class="btn btn-primary btn-sm" onclick="openAddDepartmentModal()">
            <i class="ri-add-line"></i> Add Department
        </button>
    </div>
</div>

<div id="deptListContainer">
    <div class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm"></div> Loading…</div>
</div>

<!-- Add / Edit Department modal -->
<div class="modal fade" id="deptModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="deptModalTitle">Add Department</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-uppercase" style="font-size:0.65rem;">Name *</label>
                    <input type="text" id="deptNameInput" class="form-control" placeholder="e.g. M.E.P. Department">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold text-uppercase" style="font-size:0.65rem;">Manager Name</label>
                    <input type="text" id="deptManagerInput" class="form-control" placeholder="e.g. Mr. Sinan Jaleel">
                </div>
                <input type="hidden" id="deptEditingId">
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="deptSaveBtn" onclick="saveDepartment()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Add / Edit Position modal -->
<div class="modal fade" id="posModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="posModalTitle">Add Position</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-uppercase" style="font-size:0.65rem;">Department *</label>
                    <select id="posDeptSelect" class="form-select"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold text-uppercase" style="font-size:0.65rem;">Position name *</label>
                    <input type="text" id="posNameInput" class="form-control" placeholder="e.g. A/C Technician">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold text-uppercase" style="font-size:0.65rem;">Type</label>
                    <select id="posTypeSelect" class="form-select">
                        <option value="worker">Worker</option>
                        <option value="staff">Staff</option>
                        <option value="resource">Manpower Resource</option>
                    </select>
                </div>
                <input type="hidden" id="posEditingId">
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="posSaveBtn" onclick="savePosition()">Save</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    let _depts = [];
    let _positions = [];
    let deptModal, posModal;

    function _csrf() {
        return document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
    }

    document.addEventListener('DOMContentLoaded', () => {
        deptModal = new bootstrap.Modal(document.getElementById('deptModal'));
        posModal  = new bootstrap.Modal(document.getElementById('posModal'));
        loadAll();
    });

    async function loadAll() {
        try {
            const [dRes, pRes] = await Promise.all([
                fetch('/api/attendance/admin-departments/'),
                fetch('/api/attendance/admin-positions/'),
            ]);
            const dData = await dRes.json();
            const pData = await pRes.json();
            _depts = dData.departments || [];
            _positions = pData.positions || [];
            render();
        } catch (e) {
            document.getElementById('deptListContainer').innerHTML = `<div class="text-danger small text-center py-4">Failed to load departments.</div>`;
        }
    }

    function _byDept(deptId) {
        return _positions.filter(p => p.department_id === deptId);
    }
    function _orphans() {
        return _positions.filter(p => p.department_id == null);
    }

    function render() {
        const container = document.getElementById('deptListContainer');
        if (_depts.length === 0 && _orphans().length === 0) {
            container.innerHTML = `<div class="empty-state">
                <div style="font-size:3rem;opacity:0.3;">🏢</div>
                <h5 class="fw-bold text-secondary mt-3">No departments yet</h5>
                <p class="text-muted">Click "Add Department" to create your first one.</p>
            </div>`;
            return;
        }
        const blocks = [];
        for (const d of _depts) {
            const positions = _byDept(d.id);
            blocks.push(`
                <div class="dept-row mb-3" data-dept-key="${(d.name + ' ' + (d.manager_name||'')).toLowerCase()}">
                    <div class="dept-head" onclick="toggleDept(this)">
                        <i class="ri-arrow-right-s-line dept-toggle" style="font-size:1.4rem;"></i>
                        <div class="flex-grow-1">
                            <div class="fw-bold">${_esc(d.name)}</div>
                            <div class="small text-secondary">
                                ${d.manager_name ? '<i class="ri-user-line me-1"></i>' + _esc(d.manager_name) + ' · ' : ''}
                                ${positions.length} position${positions.length === 1 ? '' : 's'}
                            </div>
                        </div>
                        <button class="btn btn-sm btn-outline-secondary" onclick="event.stopPropagation(); openAddPositionModal(${d.id})" title="Add position">
                            <i class="ri-add-line"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); openEditDepartmentModal(${d.id})" title="Edit">
                            <i class="ri-pencil-line"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="event.stopPropagation(); deleteDepartment(${d.id}, '${_esc(d.name).replace(/'/g, "\\'")}')" title="Delete">
                            <i class="ri-delete-bin-line"></i>
                        </button>
                    </div>
                    <div class="dept-body">
                        ${positions.length === 0
                            ? `<div class="small text-muted py-2">No positions yet — click + to add one.</div>`
                            : positions.map(p => `
                                <div class="pos-row" data-pos-key="${(p.name).toLowerCase()}">
                                    <i class="ri-briefcase-line text-secondary"></i>
                                    <div class="flex-grow-1">${_esc(p.name)}</div>
                                    <span class="badge-soft ${p.employee_type}">${p.employee_type}</span>
                                    <button class="btn btn-sm btn-outline-primary" onclick="openEditPositionModal(${p.id})" title="Edit"><i class="ri-pencil-line"></i></button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deletePosition(${p.id}, '${_esc(p.name).replace(/'/g, "\\'")}')" title="Delete"><i class="ri-delete-bin-line"></i></button>
                                </div>
                            `).join('')}
                    </div>
                </div>
            `);
        }

        // Orphan positions (no department) — let admins reassign or delete.
        const orphans = _orphans();
        if (orphans.length) {
            blocks.push(`
                <div class="dept-row mb-3 is-open" style="border-color:#fde68a; background:#fffbeb;">
                    <div class="dept-head">
                        <i class="ri-alert-line text-warning" style="font-size:1.4rem;"></i>
                        <div class="flex-grow-1">
                            <div class="fw-bold text-warning-emphasis">Unassigned positions</div>
                            <div class="small text-secondary">${orphans.length} position${orphans.length === 1 ? '' : 's'} not linked to any department</div>
                        </div>
                    </div>
                    <div class="dept-body" style="display:block;">
                        ${orphans.map(p => `
                            <div class="pos-row" data-pos-key="${(p.name).toLowerCase()}">
                                <i class="ri-briefcase-line text-secondary"></i>
                                <div class="flex-grow-1">${_esc(p.name)}</div>
                                <span class="badge-soft ${p.employee_type}">${p.employee_type}</span>
                                <button class="btn btn-sm btn-outline-primary" onclick="openEditPositionModal(${p.id})" title="Edit / Assign"><i class="ri-pencil-line"></i></button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deletePosition(${p.id}, '${_esc(p.name).replace(/'/g, "\\'")}')" title="Delete"><i class="ri-delete-bin-line"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `);
        }

        container.innerHTML = blocks.join('');
    }

    function toggleDept(el) {
        el.closest('.dept-row').classList.toggle('is-open');
    }

    function filterList() {
        const q = (document.getElementById('deptSearch').value || '').trim().toLowerCase();
        document.querySelectorAll('.dept-row').forEach(row => {
            const deptMatch = !q || (row.getAttribute('data-dept-key') || '').includes(q);
            let anyPosMatch = false;
            row.querySelectorAll('.pos-row').forEach(pr => {
                const m = !q || (pr.getAttribute('data-pos-key') || '').includes(q);
                pr.style.display = m ? '' : 'none';
                if (m) anyPosMatch = true;
            });
            row.style.display = (deptMatch || anyPosMatch) ? '' : 'none';
            if (q && anyPosMatch) row.classList.add('is-open');
        });
    }

    function _esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // -------- Department add/edit/delete ----------
    function openAddDepartmentModal() {
        document.getElementById('deptModalTitle').textContent = 'Add Department';
        document.getElementById('deptEditingId').value = '';
        document.getElementById('deptNameInput').value = '';
        document.getElementById('deptManagerInput').value = '';
        deptModal.show();
    }
    function openEditDepartmentModal(id) {
        const d = _depts.find(x => x.id === id);
        if (!d) return;
        document.getElementById('deptModalTitle').textContent = 'Edit Department';
        document.getElementById('deptEditingId').value = d.id;
        document.getElementById('deptNameInput').value = d.name;
        document.getElementById('deptManagerInput').value = d.manager_name || '';
        deptModal.show();
    }
    async function saveDepartment() {
        const id = document.getElementById('deptEditingId').value;
        const name = document.getElementById('deptNameInput').value.trim();
        const manager = document.getElementById('deptManagerInput').value.trim();
        if (!name) { alert('Name is required.'); return; }
        const btn = document.getElementById('deptSaveBtn');
        btn.disabled = true;
        try {
            const url = id ? `/api/attendance/admin-departments/${id}/` : `/api/attendance/admin-departments/`;
            const res = await fetch(url, {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': _csrf() },
                body: JSON.stringify({ name, manager_name: manager }),
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error || 'Failed'); return; }
            deptModal.hide();
            await loadAll();
        } catch (e) { alert('Network error'); }
        finally { btn.disabled = false; }
    }
    async function deleteDepartment(id, name) {
        if (!confirm(`Delete department "${name}"?\n\nAll its positions will be hidden too. Existing employees keep their current department label.`)) return;
        try {
            const res = await fetch(`/api/attendance/admin-departments/${id}/`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': _csrf() },
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error || 'Failed'); return; }
            await loadAll();
        } catch (e) { alert('Network error'); }
    }

    // -------- Position add/edit/delete ----------
    function _fillDeptSelect(sel) {
        sel.innerHTML = _depts.map(d => `<option value="${d.id}">${_esc(d.name)}</option>`).join('');
    }
    function openAddPositionModal(deptId) {
        document.getElementById('posModalTitle').textContent = 'Add Position';
        document.getElementById('posEditingId').value = '';
        document.getElementById('posNameInput').value = '';
        const sel = document.getElementById('posDeptSelect');
        _fillDeptSelect(sel);
        if (deptId) sel.value = String(deptId);
        document.getElementById('posTypeSelect').value = 'worker';
        posModal.show();
    }
    function openEditPositionModal(id) {
        const p = _positions.find(x => x.id === id);
        if (!p) return;
        document.getElementById('posModalTitle').textContent = 'Edit Position';
        document.getElementById('posEditingId').value = p.id;
        document.getElementById('posNameInput').value = p.name;
        const sel = document.getElementById('posDeptSelect');
        _fillDeptSelect(sel);
        if (p.department_id) sel.value = String(p.department_id);
        document.getElementById('posTypeSelect').value = p.employee_type || 'worker';
        posModal.show();
    }
    async function savePosition() {
        const id = document.getElementById('posEditingId').value;
        const name = document.getElementById('posNameInput').value.trim();
        const dept_id = document.getElementById('posDeptSelect').value;
        const emp_type = document.getElementById('posTypeSelect').value;
        if (!name) { alert('Position name is required.'); return; }
        if (!dept_id) { alert('Pick a department.'); return; }
        const btn = document.getElementById('posSaveBtn');
        btn.disabled = true;
        try {
            const url = id ? `/api/attendance/admin-positions/${id}/` : `/api/attendance/admin-positions/`;
            const res = await fetch(url, {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': _csrf() },
                body: JSON.stringify({ name, department_id: Number(dept_id), employee_type: emp_type }),
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error || 'Failed'); return; }
            posModal.hide();
            await loadAll();
        } catch (e) { alert('Network error'); }
        finally { btn.disabled = false; }
    }
    async function deletePosition(id, name) {
        if (!confirm(`Delete position "${name}"?\n\nExisting employees keep their current position label.`)) return;
        try {
            const res = await fetch(`/api/attendance/admin-positions/${id}/`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': _csrf() },
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error || 'Failed'); return; }
            await loadAll();
        } catch (e) { alert('Network error'); }
    }
</script>
{% endblock %}
