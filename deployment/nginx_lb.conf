upstream attendance_backend {
    server 127.0.0.1:8000;
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
    server 127.0.0.1:8003;
}

server {
    server_name rocketattendance.online;
    access_log /var/log/nginx/rocket_attendance_access.log;
    error_log /var/log/nginx/rocket_attendance_error.log;

    location = /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        root /home/ubuntu/attendence_app_backend;
    }
    
    location /media/ {
        root /home/ubuntu/attendence_app_backend;
    }

    location / {
        include proxy_params;
        proxy_pass http://attendance_backend;
    }
    client_max_body_size 1000M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rocketattendance.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rocketattendance.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = rocketattendance.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name rocketattendance.online;
    return 404; # managed by Certbot
}
